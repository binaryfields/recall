[package]
name = "recall"
version = "0.1.0"
edition = "2024"
description = "Lite tray system monitor for macOS"
license = "MIT"

[dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
sysinfo = { version = "0.37", default-features = false, features = ["system", "multithread"] }
tao = "0.34"
tray-icon = "0.21"
